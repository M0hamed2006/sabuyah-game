<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صابويه</title>
    <style>
        body { margin:0; background:#0a0a1f; font-family:Arial; overflow:hidden; }
        .container {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 30px auto;
            border: 6px solid #ffcc00;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 50px #ffcc00;
        }
        canvas { display:block; background:#0b1729; }
        .start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10,15,40,0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }
        button {
            padding: 15px 40px;
            font-size: 1.6rem;
            margin: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .play-btn { background:#ff4400; color:white; }
    </style>
</head>
<body>

<div class="container">
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <div id="startScreen" class="start-screen">
        <h1 style="font-size:3.5rem;color:#ffcc00;margin-bottom:10px;">صابويه 🏃‍♂️</h1>
        <p style="margin:10px;color:#bbb;">اللعبة المصرية الرهيبة</p>
        
        <div style="margin:20px 0;color:#aaa;">
            <p>أفضل مسافة: <span id="best">0</span></p>
            <p>عملات: <span id="coins">0</span></p>
        </div>
        
        <button class="play-btn" id="playBtn">🚀 ابدأ اللعب</button>
    </div>
</div>

<script>
// ====================== كل الكود في ملف واحد مؤقتاً ======================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let score = 0;
let speed = 5;
let playerX = 400;
let playerY = 420;
let isJumping = false;
let velocityY = 0;
let lane = 2;
const lanes = [160, 280, 400, 520, 640];

let obstacles = [];
let coins = [];
let gameRunning = false;

document.getElementById('playBtn').onclick = startGame;

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    gameRunning = true;
    score = 0;
    obstacles = [];
    coins = [];
    playerX = lanes[2];
    requestAnimationFrame(gameLoop);
}

function gameLoop() {
    if (!gameRunning) return;

    ctx.clearRect(0, 0, 800, 600);

    // Background
    ctx.fillStyle = '#0b1729';
    ctx.fillRect(0, 0, 800, 600);

    // Ground
    ctx.fillStyle = '#1a2a1a';
    ctx.fillRect(0, 480, 800, 120);

    // Player
    ctx.fillStyle = '#00ccff';
    ctx.fillRect(playerX-25, playerY-60, 50, 70);
    ctx.fillStyle = '#ffddaa';
    ctx.beginPath();
    ctx.arc(playerX, playerY-75, 18, 0, Math.PI*2);
    ctx.fill();

    // Spawn
    if (Math.random() < 0.03) {
        obstacles.push({x: lanes[Math.floor(Math.random()*5)], y: -50});
    }
    if (Math.random() < 0.04) {
        coins.push({x: lanes[Math.floor(Math.random()*5)], y: -50});
    }

    // Update & Draw Obstacles
    for (let i = obstacles.length-1; i >= 0; i--) {
        let o = obstacles[i];
        o.y += speed;
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(o.x-30, o.y, 60, 60);
        if (o.y > 600) obstacles.splice(i,1);
    }

    // Update & Draw Coins
    for (let i = coins.length-1; i >= 0; i--) {
        let c = coins[i];
        c.y += speed;
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(c.x, c.y, 15, 0, Math.PI*2);
        ctx.fill();
        if (c.y > 600) coins.splice(i,1);
    }

    // Controls (Keyboard)
    document.onkeydown = e => {
        if (e.key === "ArrowLeft" && lane > 0) { lane--; playerX = lanes[lane]; }
        if (e.key === "ArrowRight" && lane < 4) { lane++; playerX = lanes[lane]; }
        if (e.key === " " && !isJumping) {
            isJumping = true;
            velocityY = -15;
        }
    };

    // Jump Physics
    if (isJumping) {
        velocityY += 0.8;
        playerY += velocityY;
        if (playerY >= 420) {
            playerY = 420;
            isJumping = false;
        }
    }

    score += speed / 2;
    speed = Math.min(12, 5 + score/300);

    // HUD
    ctx.fillStyle = "white";
    ctx.font = "bold 28px Arial";
    ctx.fillText("مسافة: " + Math.floor(score), 30, 50);

    requestAnimationFrame(gameLoop);
}

// Keyboard for mobile swipe later
</script>
</body>
</html>
