<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>صابويه المتقدمة | لعبة الركض المصرية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div class="score-board">
                <span>🏆 النقاط</span>
                <span id="score">0</span>
            </div>
            <div class="high-score-board">
                <span>⭐ أعلى نتيجة</span>
                <span id="highScore">0</span>
            </div>
            <div class="speed-board">
                <span>⚡ السرعة</span>
                <span id="speedLevel">1</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div class="controls-info">
            <div class="key-hint">← → للتحرك بين المسارات</div>
            <div class="key-hint">↑ للقفز | ↓ للانزلاق</div>
            <button id="restartBtn">🔄 إعادة التشغيل</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
