<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصري الذكي | AI Egypt</title>
    <link rel="stylesheet" href="style.css">
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <!-- MobileNet للتعرف على الصور -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest"></script>
</head>
<body>
    <div class="container">
        <!-- الشعار -->
        <header>
            <h1>🧠 المصري الذكي</h1>
            <p>أول ذكاء اصطناعي مصري يشتغل من غير نت</p>
        </header>

        <!-- الكاميرا -->
        <div class="camera-section">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <button id="snapBtn" class="btn-primary">📸 صور واعرف</button>
            <button id="uploadBtn" class="btn-secondary">📁 ارفع صورة</button>
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>

        <!-- النتيجة -->
        <div id="result" class="result-box hidden">
            <div class="result-icon">🔍</div>
            <div id="resultText">جاري التحليل...</div>
            <div id="resultConfidence"></div>
        </div>

        <!-- الشات -->
        <div class="chat-section">
            <div id="chatHistory" class="chat-history"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="اسألني أي حاجة...">
                <button id="sendBtn" class="btn-primary">📨</button>
            </div>
        </div>

        <!-- المميزات -->
        <div class="features">
            <div class="feature">
                <span class="feature-icon">📸</span>
                <span>تعرف على الصور</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💬</span>
                <span>ردود ذكية</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🌐</span>
                <span>يشتغل Offline</span>
            </div>
        </div>

        <!-- التحميل -->
        <div id="loading" class="loading-overlay">
            <div class="spinner"></div>
            <p>جاري تحميل الذكاء الاصطناعي... ⏳</p>
            <p class="loading-sub">أول مرة بس، بعد كده يشتغل من غير نت!</p>
        </div>
    </div>

    <script src="ai.js"></script>
</body>
</html>
