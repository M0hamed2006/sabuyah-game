<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصري الذكي – النسر الرقمي الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #10a37f;
            --gold: #ffd700;
            --dark: #0a1428;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a1428 0%, #1a2338 100%);
            color: #e0f2fe;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://picsum.photos/id/1015/1920/1080') center/cover;
            opacity: 0.1;
            z-index: -2;
        }

        .sidebar {
            width: 350px;
            background: rgba(10, 20, 40, 0.98);
            backdrop-filter: blur(25px);
            border-left: 3px solid var(--primary);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(16,163,127,0.3);
        }

        .logo {
            font-size: 2.7rem;
            font-weight: 900;
            background: linear-gradient(90deg, #10a37f, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tab-btn {
            padding: 16px 24px;
            margin: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: #cbd5e1;
            font-size: 1.1rem;
            text-align: right;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(90deg, rgba(16,163,127,0.3), rgba(255,215,0,0.15));
            color: white;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .message {
            display: flex;
            gap: 15px;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from {opacity:0; transform:translateY(25px);} to {opacity:1; transform:none;} }

        .message-avatar {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 78%;
            padding: 20px 26px;
            border-radius: 26px 26px 10px 26px;
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #10a37f, #0a8f6b);
            border-radius: 10px 26px 26px 26px;
        }

        .input-area {
            padding: 25px 30px;
            background: rgba(10,20,40,0.95);
        }

        textarea {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 50px;
            padding: 18px 25px;
            color: white;
            font-size: 1.1rem;
            resize: none;
            max-height: 160px;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--gold));
            color: #0a1428;
            font-weight: 800;
            border: none;
            padding: 0 32px;
            border-radius: 50px;
        }
    </style>
</head>
<body class="d-flex">

<!-- Sidebar -->
<div class="sidebar">
    <div class="p-4 text-center border-bottom border-light">
        <div class="logo mb-1">🦅 المصري الذكي</div>
        <small class="text-warning">النسر الرقمي الفاخر ٢٠٢٦</small>
    </div>

    <div class="p-3">
        <div class="mb-3"><strong>🔑 مفتاح Groq</strong></div>
        <input type="password" id="groqKeyInput" class="form-control mb-2" placeholder="gsk_...">
        <button onclick="saveKey()" class="btn btn-success w-100">حفظ المفتاح</button>
    </div>

    <div class="px-3">
        <select id="modelSelect" class="form-select">
            <option value="llama-3.3-70b-versatile">Llama 3.3 70B (الأقوى)</option>
            <option value="llama-3.1-70b-versatile">Llama 3.1 70B</option>
            <option value="deepseek-r1-distill-llama-70b">DeepSeek R1 70B</option>
            <option value="qwen-qwq-32b">Qwen QwQ 32B</option>
            <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
        </select>
    </div>

    <div class="mt-auto p-4 text-center small">
        <strong>Mohamed Ragab Abdel Moneim</strong><br>
        مطور المشروع
    </div>
</div>

<!-- Main Area -->
<div class="main-content d-flex flex-column">
    <div class="p-3 d-flex justify-content-between align-items-center border-bottom">
        <h4 id="panelTitle">🦅 دردشة</h4>
    </div>

    <!-- Chat Panel -->
    <div id="chatPanel" class="flex-grow-1 d-flex flex-column">
        <div id="chatMessages" class="chat-messages"></div>
        
        <div class="input-area">
            <div class="d-flex gap-2">
                <textarea id="chatInput" rows="2" placeholder="اكتب رسالتك... (ارسم: وصف)"></textarea>
                <button id="sendBtn" style="width:110px">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Image Panel -->
    <div id="imagePanel" class="flex-grow-1 p-5 d-none">
        <h3 class="text-warning mb-4">🎨 توليد صور فاخرة</h3>
        <input id="imagePrompt" class="form-control form-control-lg mb-3" placeholder="وصف الصورة بالتفصيل...">
        <button id="genImageBtn" class="btn btn-primary btn-lg">توليد الصورة</button>
        <div id="generatedImageContainer" class="mt-4"></div>
    </div>
</div>

<script>
// ====================== التطبيق القوي ======================
let groqKey = localStorage.getItem('groq_key') || '';
let currentModel = 'llama-3.3-70b-versatile';

const elements = {
    chatInput: document.getElementById('chatInput'),
    sendBtn: document.getElementById('sendBtn'),
    chatMessages: document.getElementById('chatMessages'),
    modelSelect: document.getElementById('modelSelect'),
    groqKeyInput: document.getElementById('groqKeyInput')
};

// تحميل البيانات
elements.groqKeyInput.value = groqKey;
elements.modelSelect.value = currentModel;

elements.modelSelect.addEventListener('change', (e) => {
    currentModel = e.target.value;
});

// حفظ المفتاح
window.saveKey = function() {
    const key = elements.groqKeyInput.value.trim();
    if (key.startsWith('gsk_')) {
        groqKey = key;
        localStorage.setItem('groq_key', key);
        alert('✅ تم حفظ مفتاح Groq بنجاح');
    } else {
        alert('❌ المفتاح غير صحيح! يجب أن يبدأ بـ gsk_');
    }
};

// إضافة رسالة
function addMessage(role, content, isImage = false, imgUrl = '') {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    
    if (isImage) {
        div.innerHTML = `
            <div class="message-avatar">🦅</div>
            <div class="message-content">
                <img src="${imgUrl}" style="max-width:100%; border-radius:18px; cursor:pointer;" onclick="window.open('${imgUrl}')">
            </div>`;
    } else {
        div.innerHTML = `
            <div class="message-avatar">${role === 'user' ? '👤' : '🦅'}</div>
            <div class="message-content">${content}</div>`;
    }
    
    elements.chatMessages.appendChild(div);
    elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
}

// إرسال رسالة
async function sendMessage() {
    const text = elements.chatInput.value.trim();
    if (!text) return;

    addMessage('user', text);
    elements.chatInput.value = '';

    if (!groqKey) {
        addMessage('bot', '⚠️ أدخل مفتاح Groq أولاً من الجانب الأيسر');
        return;
    }

    // توليد صورة
    if (text.startsWith('ارسم:') || text.startsWith('ارسم ')) {
        const prompt = text.replace(/ارسم[:\s]*/i, '').trim();
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&enhance=true`;
        addMessage('bot', `🖼️ ${prompt}`, true, url);
        return;
    }

    // دردشة عادية
    addMessage('bot', '🧠 جاري التفكير...', false);

    try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${groqKey}`
            },
            body: JSON.stringify({
                model: currentModel,
                messages: [{ role: 'user', content: text }],
                temperature: 0.85,
                max_tokens: 2048
            })
        });

        if (!response.ok) throw new Error('فشل الاتصال بالخادم');

        const data = await response.json();
        const reply = data.choices[0].message.content;
        
        // استبدال آخر رسالة "جاري التفكير"
        elements.chatMessages.lastChild.remove();
        addMessage('bot', reply);

    } catch (error) {
        elements.chatMessages.lastChild.remove();
        addMessage('bot', `❌ خطأ: ${error.message}`);
    }
}

// الأحداث
elements.sendBtn.addEventListener('click', sendMessage);
elements.chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// رسالة ترحيب
setTimeout(() => {
    addMessage('bot', `✨ مرحباً يا محمد!<br>أقوى وأفخم نسخة من <strong>المصري الذكي</strong> جاهزة الآن.<br><br>ضع مفتاح Groq وابدأ المتعة 🔥`);
}, 800);
</script>
</body>
</html>
