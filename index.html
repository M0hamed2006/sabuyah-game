<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصري الذكي | AI Chat + صور</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- الشريط العلوي -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🧠</span>
                <span>المصري الذكي</span>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="icon-btn" title="الوضع الليلي/النهاري">🌙</button>
                <button id="clearChat" class="icon-btn" title="مسح المحادثة">🗑️</button>
            </div>
        </header>

        <!-- منطقة الشات -->
        <main class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <p>مرحباً! أنا المصري الذكي. اسألني أي شيء، أو اكتب "ارسم: وصف الصورة" لتوليد صورة.</p>
                        <p>🔹 <strong>النماذج المتاحة:</strong> يمكنك اختيار النموذج من القائمة العلوية.</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- شريط الأدوات السفلي -->
        <footer class="input-area">
            <div class="model-selector">
                <select id="modelSelect" class="model-select">
                    <option value="llama-3.3-70b-versatile">🦙 Llama 3.3 70B</option>
                    <option value="mixtral-8x7b-32768">🌀 Mixtral 8x7B</option>
                    <option value="gemma2-9b-it">🧠 Gemma 2 9B</option>
                    <option value="llama-3.1-8b-instant">⚡ Llama 3.1 8B</option>
                </select>
                <button id="drawBtn" class="draw-btn" title="توليد صورة">🎨 ارسم</button>
            </div>
            <div class="input-wrapper">
                <textarea
                    id="chatInput"
                    placeholder="اكتب رسالتك هنا..."
                    rows="1"
                ></textarea>
                <button id="sendBtn" class="send-btn">إرسال</button>
            </div>
            <div class="api-status" id="apiStatus">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">الرجاء إدخال مفتاح API</span>
            </div>
        </footer>
    </div>

    <!-- مودال إدخال المفتاح -->
    <div id="apiModal" class="modal">
        <div class="modal-content">
            <h2>🔑 إعدادات API</h2>
            <p>أدخل مفتاح Groq API الخاص بك (مجاني من <a href="https://console.groq.com" target="_blank">console.groq.com</a>)</p>
            <input type="password" id="apiKeyInput" placeholder="gsk_..." class="api-input">
            <div class="modal-buttons">
                <button id="saveApiBtn" class="btn-primary">حفظ</button>
                <button id="skipApiBtn" class="btn-secondary">تخطي (ردود محدودة)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
