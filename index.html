<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>المصري الذكي | Groq AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a2f1f, #061a10);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            padding: 20px;
        }

        .container {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            border: 1px solid #ffd70066;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 36px;
            color: #ffd700;
            text-shadow: 0 0 10px #ffaa44;
        }

        .subtitle {
            color: #ffdd99;
            font-size: 14px;
        }

        .chat-area {
            background: #1e3a2faa;
            border-radius: 24px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .chat-history {
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            background: #0a2f1faa;
            border-radius: 16px;
        }

        .chat-message {
            padding: 10px 15px;
            margin-bottom: 12px;
            border-radius: 20px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .chat-message.user {
            background: #ffd700;
            color: #1e3a2f;
            margin-right: auto;
            text-align: right;
        }

        .chat-message.ai {
            background: #2c3e50;
            color: white;
            margin-left: auto;
            text-align: left;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #chatInput {
            flex: 1;
            padding: 12px;
            border-radius: 60px;
            border: none;
            background: #0a2f1f;
            color: white;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }

        #sendBtn {
            background: #ffd700;
            border: none;
            width: 48px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: 0.2s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
            background: #ffaa00;
        }

        .status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 12px;
            color: #ccc;
        }

        button {
            background: #2c3e50;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇪🇬 المصري الذكي</h1>
            <p class="subtitle">🧠 يعمل بالذكاء الاصطناعي Groq - Llama 3.3 (مجاني وسريع)</p>
        </div>

        <div class="chat-area">
            <div id="chatHistory" class="chat-history"></div>
            <div class="input-wrapper">
                <input type="text" id="chatInput" placeholder="اسألني أي حاجة... (مثال: قارن بين ميسي ورونالدو)">
                <button id="sendBtn">➤</button>
            </div>
        </div>

        <div class="status">
            <span>🟢 <span id="statusText">متصل</span></span>
            <button id="clearBtn">🧹 مسح المحادثة</button>
            <span>🤖 Groq AI</span>
        </div>
    </div>

    <script src="ai-core.js"></script>
</body>
</html>
