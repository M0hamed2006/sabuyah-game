<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>صابويه - اللعبة الشهيرة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="info-panel">
            <div>🎯 النقاط: <span id="score">0</span></div>
            <div>❤️ الحياة: <span id="lives">3</span></div>
            <div>⏱️ الوقت: <span id="time">30</span> ثانية</div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="controls">
            <button id="restartBtn">🔄 إعادة البدء</button>
            <div class="keys">استخدم أسهم لوحة المفاتيح ↑ ↓ ← →</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
