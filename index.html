<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>صابويه | 3D Reality</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- المحرك الثلاثي الأبعاد -->
  <div id="game-container"></div>

  <!-- طبقة الواجهة -->
  <div class="ui-layer">

    <!-- شاشة البداية -->
    <div id="startScreen" class="overlay active">
      <h1 class="main-title">SABUYAH<span>REALITY</span></h1>
      <p class="subtitle">الجيل الجديد · ثلاثي الأبعاد</p>
      <button id="playBtn" class="btn-royal">▶ العب الآن</button>
      <button id="creditsBtn" class="btn-glass">👨‍💻 المطور</button>
      <p class="hint">
        أسهم / WASD للتحرك · مسافة للقفز · S للانزلاق · B للبوست
        <br>أو السحب على الشاشة اللمسية
      </p>
    </div>

    <!-- واجهة اللعب (يتم حقنها ديناميكياً من game.js) -->
    <div id="gameUI" class="overlay hidden"></div>

    <!-- شاشة الخسارة (يتم حقنها ديناميكياً) -->
    <div id="gameOverScreen" class="overlay hidden"></div>

    <!-- شاشة المطور -->
    <div id="creditsScreen" class="overlay hidden">
      <div class="glass-card">
        <h2>👨‍💻 المطور</h2>
        <p class="dev-name">The Small Programmer</p>
        <p class="dev-name-en">Mohamed Ragab Abdelmonem</p>
        <p style="color:#aaa;font-size:0.9rem;margin-bottom:20px">لعبة صابويه - نسخة ثلاثية الأبعاد</p>
        <button id="closeCreditsBtn" class="btn-glass">← رجوع</button>
      </div>
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
