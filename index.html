<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sabuyah — Ultimate Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- واجهة البداية -->
  <div id="startScreen" class="screen active">
    <h1>صابويه ULTIMATE</h1>
    <button id="btnPlay">▶ ابدأ اللعب</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-block">النقاط: <span id="score">0</span></div>
    <div class="hud-block">المرحلة: <span id="level">القاهرة</span></div>
    <div class="hud-block">💰 <span id="coins">0</span></div>
    <div class="hud-block danger">
      خطر: <div class="danger-bar"><div id="dangerFill"></div></div>
    </div>
    <div class="hud-block boost">
      ⚡ <div class="boost-bar"><div id="boostFill"></div></div>
    </div>
  </div>

  <!-- شاشة النهاية -->
  <div id="gameOver" class="screen">
    <h2>انتهت اللعبة 💥</h2>
    <p>النقاط: <span id="finalScore">0</span></p>
    <button id="btnRestart">🔄 مجدداً</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
