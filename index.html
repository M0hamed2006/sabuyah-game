<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>المصري الذكي 🧠 | Groq AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #feca57;
        }

        .chat-header p {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.9rem;
        }

        .message.user {
            background: #feca57;
            color: #1a1a2e;
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }

        .message.ai {
            background: rgba(255, 255, 255, 0.1);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }

        .chat-input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
        }

        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-input-area button {
            background: #feca57;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .chat-input-area button:hover {
            transform: scale(1.05);
        }

        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
            color: #aaa;
            font-size: 0.8rem;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #feca57;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-5px); }
        }

        .status {
            padding: 5px 15px;
            font-size: 0.7rem;
            text-align: center;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
        }

        .status.error {
            color: #ff6b6b;
            opacity: 1;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            padding: 8px 20px;
            background: rgba(0,0,0,0.2);
            font-size: 0.7rem;
        }

        .toolbar button {
            background: none;
            border: none;
            color: #feca57;
            cursor: pointer;
            font-family: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: #feca57;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🇪🇬 المصري الذكي</h1>
            <p>مساعد ذكي يعمل بـ Groq Cloud | Llama 3.3</p>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                ✨ أهلاً بك! أنا المصري الذكي. اسألني أي حاجة، وهحاول أساعدك بأفضل صورة.
            </div>
        </div>

        <div class="toolbar">
            <span id="statusText">⚡ جاهز</span>
            <button id="clearBtn">🗑️ مسح المحادثة</button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب سؤالك هنا..." autofocus>
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        class GroqAssistant {
            constructor() {
                this.apiKey = localStorage.getItem('groq_api_key');
                this.apiUrl = 'https://api.groq.com/openai/v1/chat/completions';
                this.model = 'llama-3.3-70b-versatile';
                this.messages = [];
                this.isLoading = false;
                this.init();
            }

            async init() {
                this.bindEvents();
                if (!this.apiKey) {
                    this.promptApiKey();
                } else {
                    this.updateStatus('جاهز ✅');
                }
            }

            promptApiKey() {
                const key = prompt("🔑 أدخل مفتاح Groq API الخاص بك:\n(يمكنك الحصول عليه مجاناً من console.groq.com)");
                if (key && key.startsWith('gsk_')) {
                    localStorage.setItem('groq_api_key', key);
                    this.apiKey = key;
                    this.updateStatus('جاهز ✅');
                } else if (key) {
                    alert("❌ مفتاح غير صالح! يجب أن يبدأ بـ gsk_");
                    this.promptApiKey();
                } else {
                    this.updateStatus('⚠️ مطلوب مفتاح API', true);
                }
            }

            bindEvents() {
                document.getElementById('sendBtn').addEventListener('click', () => this.sendMessage());
                document.getElementById('messageInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.sendMessage();
                });
                document.getElementById('clearBtn').addEventListener('click', () => this.clearChat());
            }

            async sendMessage() {
                if (this.isLoading) return;
                
                const input = document.getElementById('messageInput');
                const message = input.value.trim();
                if (!message) return;

                if (!this.apiKey) {
                    this.promptApiKey();
                    return;
                }

                this.addMessage(message, 'user');
                input.value = '';
                this.setLoading(true);

                try {
                    const response = await this.callGroq(message);
                    this.addMessage(response || 'عذراً، لم أستطع الإجابة.', 'ai');
                } catch (error) {
                    this.addMessage(`❌ حدث خطأ: ${error.message}`, 'ai');
                } finally {
                    this.setLoading(false);
                }
            }

            async callGroq(question) {
                const messages = [
                    { role: 'system', content: 'أنت مساعد ذكي مصري الجنسية، تتحدث بالعربية الفصحى أو العامية المصرية. أجب بإجابات مفيدة وطبيعية.' },
                    ...this.messages.slice(-5),
                    { role: 'user', content: question }
                ];

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000);

                    const response = await fetch(this.apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.apiKey}`
                        },
                        body: JSON.stringify({
                            model: this.model,
                            messages: messages,
                            temperature: 0.7,
                            max_tokens: 800
                        }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `خطأ ${response.status}`);
                    }

                    const data = await response.json();
                    const reply = data.choices[0]?.message?.content || 'عذراً، لم أحصل على رد.';
                    
                    this.messages.push({ role: 'user', content: question });
                    this.messages.push({ role: 'assistant', content: reply });
                    
                    return reply;
                } catch (error) {
                    if (error.name === 'AbortError') throw new Error('انتهى وقت الطلب، حاول مرة أخرى.');
                    throw error;
                }
            }

            addMessage(text, sender) {
                const messagesDiv = document.getElementById('chatMessages');
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                messageDiv.textContent = text;
                messagesDiv.appendChild(messageDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            clearChat() {
                if (confirm('هل أنت متأكد من مسح المحادثة؟')) {
                    const messagesDiv = document.getElementById('chatMessages');
                    messagesDiv.innerHTML = '<div class="message ai">✨ تم مسح المحادثة. اسألني أي حاجة جديدة.</div>';
                    this.messages = [];
                }
            }

            setLoading(loading) {
                this.isLoading = loading;
                const sendBtn = document.getElementById('sendBtn');
                const input = document.getElementById('messageInput');
                if (loading) {
                    sendBtn.disabled = true;
                    input.disabled = true;
                    this.addTypingIndicator();
                } else {
                    sendBtn.disabled = false;
                    input.disabled = false;
                    input.focus();
                    this.removeTypingIndicator();
                }
            }

            addTypingIndicator() {
                this.removeTypingIndicator();
                const messagesDiv = document.getElementById('chatMessages');
                this.typingDiv = document.createElement('div');
                this.typingDiv.className = 'message ai typing';
                this.typingDiv.innerHTML = '<span></span><span></span><span></span> يكتب...';
                messagesDiv.appendChild(this.typingDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            removeTypingIndicator() {
                if (this.typingDiv) this.typingDiv.remove();
            }

            updateStatus(text, isError = false) {
                const statusSpan = document.getElementById('statusText');
                if (statusSpan) {
                    statusSpan.textContent = text;
                    if (isError) statusSpan.classList.add('error');
                    else statusSpan.classList.remove('error');
                }
            }
        }

        // بدء التشغيل فوراً
        window.addEventListener('DOMContentLoaded', () => {
            window.assistant = new GroqAssistant();
        });
    </script>
</body>
</html>
