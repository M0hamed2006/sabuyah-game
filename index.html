<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SABUYAH ELITE | صابويه الفخامة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="master-container">
    <!-- شاشة البداية الملكية -->
    <div id="startScreen" class="overlay active">
        <div class="brand-glow"></div>
        <h1 class="main-title">SABUYAH <span>ELITE</span></h1>
        <p class="subtitle">الإصدار الملكي الأسطوري</p>
        
        <div class="stats-panel">
            <div class="stat-item">
                <span class="label">أعلى مجموع</span>
                <span id="startHighScore" class="value">0</span>
            </div>
            <div class="stat-separator"></div>
            <div class="stat-item">
                <span class="label">الرحلات</span>
                <span id="totalAttempts" class="value">0</span>
            </div>
        </div>

        <div class="action-buttons">
            <button id="playBtn" class="btn-royal">انطلاق للمغامرة</button>
            <div class="sub-buttons">
                <button id="settingsBtn" class="btn-glass">الإعدادات</button>
                <button id="creditsBtn" class="btn-glass">المطور</button>
            </div>
        </div>
        
        <div class="hint-text">استخدم الأسهم ← → أو اسحب الشاشة للمراوغة</div>
    </div>

    <!-- شاشة اللعبة -->
    <div id="gameScreen" class="overlay hidden">
        <div class="hud">
            <div class="hud-left">
                <div class="hud-box">
                    <span class="hud-icon">🏆</span>
                    <span id="score">0</span>
                </div>
            </div>
            <div class="hud-right">
                <div class="hud-box">
                    <span class="hud-icon">💰</span>
                    <span id="coinCount">0</span>
                </div>
                <button id="pauseGameBtn" class="mini-btn">⏸</button>
            </div>
        </div>
        
        <div id="activePowerups" class="powerup-container"></div>
        
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- شاشة الموت الفخمة -->
    <div id="gameOverScreen" class="overlay hidden">
        <div class="glass-card">
            <h2 class="game-over-title">انتهت الرحلة</h2>
            <div class="final-stats">
                <div class="f-stat"><span>النقاط:</span> <b id="finalScore">0</b></div>
                <div class="f-stat"><span>العملات:</span> <b id="finalCoins">0</b></div>
                <div class="f-stat gold"><span>أفضل رقم:</span> <b id="finalHigh">0</b></div>
            </div>
            <button id="restartBtn" class="btn-royal">محاولة أخرى</button>
            <button id="menuFromOverBtn" class="btn-glass">القائمة الرئيسية</button>
        </div>
    </div>

    <!-- شاشة الإعدادات -->
    <div id="settingsScreen" class="overlay hidden">
        <div class="glass-card">
            <h2>الإعدادات الملكية</h2>
            <div class="setting-group">
                <label>المؤثرات الصوتية</label>
                <input type="checkbox" id="soundToggle" checked>
            </div>
            <div class="setting-group">
                <label>مستوى الموسيقى</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="70">
            </div>
            <button id="saveSettingsBtn" class="btn-royal">حفظ</button>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
