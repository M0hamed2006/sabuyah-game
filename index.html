<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصري الذكي – النسر الرقمي الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root { --primary: #10a37f; --gold: #ffd700; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a1428, #1a2338);
            color: #e0f2fe;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://picsum.photos/id/1015/1920/1080') center/cover;
            opacity: 0.08;
            z-index: -1;
        }
        .sidebar {
            width: 360px;
            background: rgba(10,20,40,0.98);
            backdrop-filter: blur(25px);
            border-left: 4px solid var(--primary);
            display: flex;
            flex-direction: column;
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #10a37f, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tab-btn {
            padding: 18px 25px;
            margin: 8px 12px;
            border-radius: 18px;
            background: rgba(255,255,255,0.06);
            border: none;
            color: #cbd5e1;
            font-size: 1.15rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: linear-gradient(90deg, rgba(16,163,127,0.35), rgba(255,215,0,0.2));
            color: white;
            box-shadow: 0 8px 25px rgba(16,163,127,0.3);
        }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .panel { display: none; flex-direction: column; height: 100%; }
        .panel.active { display: flex; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            gap: 25px;
            display: flex;
            flex-direction: column;
        }
        .message {
            display: flex;
            gap: 16px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
        .message-avatar {
            width: 54px; height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
        }
        .message-content {
            max-width: 78%;
            padding: 20px 26px;
            border-radius: 26px 26px 10px 26px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #10a37f, #0a8f6b);
            border-radius: 10px 26px 26px 26px;
        }
        .input-area {
            padding: 25px 30px;
            background: rgba(10,20,40,0.95);
        }
        textarea {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 50px;
            padding: 18px 25px;
            color: white;
            font-size: 1.1rem;
        }
        button {
            background: linear-gradient(135deg, var(--primary), var(--gold));
            color: #0a1428;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
        }
    </style>
</head>
<body class="d-flex">

<!-- Sidebar -->
<div class="sidebar">
    <div class="p-4 text-center border-bottom">
        <div class="logo">🦅 المصري الذكي</div>
        <small class="text-warning">النسر الرقمي الفاخر</small>
    </div>

    <div class="tabs mt-3">
        <button class="tab-btn active" data-tab="chat"><i class="fas fa-comments"></i> دردشة</button>
        <button class="tab-btn" data-tab="search"><i class="fas fa-search"></i> بحث عميق</button>
        <button class="tab-btn" data-tab="image"><i class="fas fa-image"></i> توليد صور</button>
        <button class="tab-btn" data-tab="settings"><i class="fas fa-cog"></i> الإعدادات</button>
    </div>

    <div class="mt-auto p-4 text-center small text-white-50">
        <strong>Mohamed Ragab Abdel Moneim</strong><br>
        مطور المشروع
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <!-- دردشة -->
    <div id="chat" class="panel active">
        <div class="p-4 border-bottom d-flex justify-content-between align-items-center">
            <h4>🦅 دردشة ذكية</h4>
            <select id="modelSelect">
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                <option value="llama-3.1-70b-versatile">Llama 3.1 70B</option>
                <option value="deepseek-r1-distill-llama-70b">DeepSeek R1</option>
                <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
            </select>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="input-area">
            <div class="d-flex gap-3">
                <textarea id="chatInput" rows="2" placeholder="اكتب رسالتك... (ارسم: ... لبحث استخدم تبويب البحث)"></textarea>
                <button id="sendBtn">إرسال</button>
            </div>
        </div>
    </div>

    <!-- بحث عميق -->
    <div id="search" class="panel">
        <div class="p-5">
            <h3 class="text-warning mb-4"><i class="fas fa-search"></i> بحث عميق</h3>
            <input id="searchInput" class="form-control form-control-lg mb-3" placeholder="ابحث عن أي شيء...">
            <button id="searchBtn" class="btn btn-light">بحث</button>
            <div id="searchResults" class="mt-4" style="background:rgba(255,255,255,0.05); padding:20px; border-radius:15px; min-height:300px;"></div>
        </div>
    </div>

    <!-- توليد صور -->
    <div id="image" class="panel">
        <div class="p-5">
            <h3 class="text-warning mb-4"><i class="fas fa-palette"></i> توليد صور فاخرة</h3>
            <input id="imagePrompt" class="form-control form-control-lg mb-3" placeholder="وصف الصورة بالعربي أو الإنجليزي...">
            <button id="genBtn" class="btn btn-primary">توليد الصورة</button>
            <div id="imageResult" class="mt-4 text-center"></div>
        </div>
    </div>

    <!-- الإعدادات -->
    <div id="settings" class="panel">
        <div class="p-5">
            <h3 class="text-warning mb-4"><i class="fas fa-key"></i> إعدادات API</h3>
            <label class="form-label">مفتاح Groq API</label>
            <input type="password" id="groqKeyInput" class="form-control form-control-lg mb-3" placeholder="gsk_xxxxxxxxxxxxxxxx">
            <button onclick="saveGroqKey()" class="btn btn-success btn-lg w-100">حفظ المفتاح</button>
            <div id="keyStatus" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
// ==================== المتغيرات العامة ====================
let groqKey = localStorage.getItem('groq_key') || '';
let currentModel = 'llama-3.3-70b-versatile';

// تبويبات
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
        document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
    });
});

// حفظ المفتاح
window.saveGroqKey = function() {
    const key = document.getElementById('groqKeyInput').value.trim();
    const status = document.getElementById('keyStatus');
    
    if (key.startsWith('gsk_')) {
        groqKey = key;
        localStorage.setItem('groq_key', key);
        status.innerHTML = `<span style="color:#10a37f;">✅ تم حفظ المفتاح بنجاح وهو صحيح</span>`;
    } else {
        status.innerHTML = `<span style="color:#ff4444;">❌ المفتاح غير صحيح. يجب أن يبدأ بـ gsk_</span>`;
    }
};

// إضافة رسالة
function addMessage(role, content, isImage = false, imgUrl = '') {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    
    if (isImage) {
        div.innerHTML = `
            <div class="message-avatar">🦅</div>
            <div class="message-content">
                <img src="${imgUrl}" style="max-width:100%; border-radius:16px;" onclick="window.open('${imgUrl}')">
            </div>`;
    } else {
        div.innerHTML = `
            <div class="message-avatar">${role === 'user' ? '👤' : '🦅'}</div>
            <div class="message-content">${content}</div>`;
    }
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// إرسال رسالة
document.getElementById('sendBtn').addEventListener('click', async () => {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';

    if (!groqKey) {
        addMessage('bot', '⚠️ لم تقم بإدخال مفتاح Groq بعد. اذهب إلى تبويب "الإعدادات"');
        return;
    }

    addMessage('bot', '🧠 جاري التفكير...');

    try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${groqKey}`
            },
            body: JSON.stringify({
                model: currentModel,
                messages: [{role: 'user', content: text}],
                temperature: 0.8,
                max_tokens: 2000
            })
        });

        const data = await res.json();
        document.getElementById('chatMessages').lastChild.remove();
        addMessage('bot', data.choices[0].message.content);
    } catch (e) {
        document.getElementById('chatMessages').lastChild.remove();
        addMessage('bot', `❌ خطأ: ${e.message}`);
    }
});

// توليد صور
document.getElementById('genBtn').addEventListener('click', () => {
    const prompt = document.getElementById('imagePrompt').value.trim();
    if (!prompt) return alert('اكتب وصف الصورة');
    
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=1024&enhance=true`;
    document.getElementById('imageResult').innerHTML = `
        <img src="${url}" style="max-width:100%; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5);" onclick="window.open('${url}')">
    `;
});

// بحث ويكيبيديا
document.getElementById('searchBtn').addEventListener('click', async () => {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    
    const resDiv = document.getElementById('searchResults');
    resDiv.innerHTML = 'جاري البحث...';
    
    try {
        const url = `https://ar.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        
        let html = `<h5>نتائج البحث عن: ${q}</h5>`;
        data.query.search.forEach(item => {
            html += `<div style="margin:15px 0; padding:12px; background:rgba(255,255,255,0.05); border-radius:10px;">
                        <strong>${item.title}</strong><br>
                        <small>${item.snippet}</small>
                     </div>`;
        });
        resDiv.innerHTML = html;
    } catch(e) {
        resDiv.innerHTML = 'حدث خطأ في البحث';
    }
});

// Enter Key
document.getElementById('chatInput').addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('sendBtn').click();
    }
});

// ترحيب
setTimeout(() => {
    addMessage('bot', `✨ مرحباً يا محمد!<br>النسخة الكاملة والقوية جاهزة.<br>ضع مفتاح Groq في الإعدادات وابدأ.`);
}, 600);
</script>
</body>
</html>
